# Cấu hình chung; các giá trị ${...} được lấy từ biến môi trường khi chạy.
spring:
  application:
    name: ticketbooking

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # Kết nối PostgreSQL; tên cơ sở dữ liệu và thông tin đăng nhập do môi trường cung cấp.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASS}

  jpa:
    hibernate:
      # Tự cập nhật schema trong môi trường dev; dùng migration khi triển khai production.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Kết nối RabbitMQ để gửi và nhận message mua vé.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

  data:
    # Lưu bộ đếm tồn kho và khóa chống gửi lại yêu cầu.
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

# Đường dẫn tài liệu OpenAPI và giao diện thử API.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Sắp xếp cố định thay vì theo thứ tự Spring quét được — thứ tự quét không
    # ổn định giữa các lần chạy, khiến trang docs "nhảy" vô cớ.
    tags-sorter: alpha
    operations-sorter: method
    # Ẩn khối "Models" ở cuối trang; schema vẫn xem được khi bung từng response.
    default-models-expand-depth: -1
  # Chỉ sinh docs cho controller của ứng dụng, bỏ qua các endpoint do starter
  # khác đăng ký (error controller, actuator...).
  paths-to-match: /api/**

app:
  jwt:
    # Base64 của khoá HMAC, tối thiểu 256 bit. Cố ý không đặt giá trị mặc định
    # để app chết ngay lúc khởi động nếu môi trường triển khai quên set biến,
    # thay vì chạy với một secret đã nằm trong git.
    # Sinh khoá mới: openssl rand -base64 64
    secret: ${JWT_SECRET}
    issuer: ticketbooking
    # TTL của access token; các quyền trong token có hiệu lực tới khi token hết hạn.
    access-token-ttl: 15m
