# Load balancing theo round-robin giữa ba app instance trong mạng Compose.
upstream backend_app {
    server app1:8080;
    server app2:8080;
    server app3:8080;
}

# Log địa chỉ upstream xử lý request để theo dõi load balancing.
log_format upstream_debug '$remote_addr - "$request" $status upstream=$upstream_addr';

server {
    listen 80;

    access_log /dev/stdout upstream_debug;

    location / {
        proxy_pass http://backend_app;

        # Chuyển tiếp IP của client, Host và protocol gốc qua các proxy header.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}