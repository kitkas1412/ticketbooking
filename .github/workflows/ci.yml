name: CI

on:
  pull_request:
  push:
    branches: [main]

# Push commit mới vào PR sẽ huỷ lần chạy cũ; build trên main luôn chạy đủ.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Build với JDK 21: từ JDK 23 annotation processing bị tắt mặc định nên Lombok
      # không chạy ở các module không khai báo annotationProcessorPaths.
      - name: Build and run tests
        run: ./mvnw -B -ntp clean verify

      # Tóm tắt kết quả test ở trang Summary và annotate test lỗi trên PR.
      # annotate_only để không cần quyền checks: write (PR từ fork chỉ có token read-only).
      - name: Test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: "**/target/surefire-reports/TEST-*.xml"
          annotate_only: true
          detailed_summary: true
          require_tests: true

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          retention-days: 7
