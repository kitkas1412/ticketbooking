name: Secret Scan

# Quét toàn bộ lịch sử git bằng gitleaks để phát hiện secret (token, mật khẩu, private key...)
# bị lỡ commit. Kết quả hiện trong log (đã che giá trị) và tab Security → Code scanning.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Quét lại hằng tuần (thứ Hai 08:00 giờ VN) để áp dụng rule mới của gitleaks.
    - cron: "0 1 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Tải binary từ release chính thức và kiểm tra checksum thay vì dùng action bên thứ ba.
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " ${archive}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      # False positive đã xác nhận: đánh dấu `gitleaks:allow` trên dòng code,
      # hoặc thêm fingerprint vào .gitleaksignore cho commit cũ.
      - name: Scan git history
        run: |
          "$RUNNER_TEMP/gitleaks" git . \
            --redact --no-banner --exit-code 1 \
            --report-format sarif --report-path gitleaks.sarif

      # PR từ fork chỉ có token read-only nên không upload được SARIF.
      - name: Upload results to code scanning
        if: >-
          ${{ !cancelled() && hashFiles('gitleaks.sarif') != ''
              && (github.event_name != 'pull_request'
                  || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
