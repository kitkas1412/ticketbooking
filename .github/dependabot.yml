version: 2

# Prefix commit/PR title để khớp kiểm tra PR title (vd: "build(deps): bump ...").
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    # Gộp bản minor/patch vào 1 PR; bản major tách riêng vì dễ có breaking change.
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Ho_Chi_Minh
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies]
    groups:
      github-actions:
        patterns: ["*"]
