# Chạy ba app instance dùng chung DB, Redis và RabbitMQ, với Nginx làm load balancer.
# Đường dẫn build và tệp Nginx còn theo bố cục cũ; cần đối chiếu trước khi chạy.
services:
  # Các app instance kết nối PostgreSQL, Redis và RabbitMQ qua service name trong Compose.
  app1:
    build: ..
    depends_on:
      - postgres
      - redis
      - rabbitmq
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      REDIS_HOST: redis
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASS: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS}

  app2:
    build: ..
    depends_on:
      - postgres
      - redis
      - rabbitmq
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      REDIS_HOST: redis
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASS: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS}

  app3:
    build: ..
    depends_on:
      - postgres
      - redis
      - rabbitmq
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      REDIS_HOST: redis
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASS: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS}

  # PostgreSQL lưu tài khoản, sự kiện, vé, đơn hàng và outbox.
  postgres:
    image: postgres:16
    container_name: ticketbookingsystem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Bộ đếm tồn kho nhanh và idempotency key yêu cầu.
  redis:
    image: redis:8.8-alpine
    container_name: ticketbookingsystem-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Cổng 5672 dùng cho AMQP; cổng 15672 dùng cho giao diện quản trị.
  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine
    container_name: ticketbookingsystem-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Nginx nhận HTTP request và proxy tới các app instance.
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - app1
      - app2
      - app3

# Giữ dữ liệu PostgreSQL và RabbitMQ khi tạo lại container.
volumes:
  postgres_data:
    name: ticket-booking-system-postgres-data
  rabbitmq_data:
    name: ticket-booking-system-rabbitmq-data
